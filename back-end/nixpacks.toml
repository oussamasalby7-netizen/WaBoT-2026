# nixpacks.toml
# This file configures the Railway builder (Nixpacks) for the Laravel backend.

[providers]
# Enable both PHP and Node.js providers so Nixpacks installs composer, PHP extensions, Node.js, and npm.
php = {}
node = {}

[phases.setup]
# Force nixpacks to use PHP 8.2 or 8.3
nixPkgs = ["php82", "php82Packages.composer", "nodejs"]

[phases.build]
# Build steps for production
dependsOn = ["setup"]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
    "if [ -f package-lock.json ]; then npm ci && npm run build; else npm install && npm run build; fi"
]

[start]
# API service (Railway Service 1)
cmd = "php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"

# WebSockets service (Railway Service 2 — same repo, separate service):
#   Start command: sh scripts/start-websockets.sh
#   Set PUSHER_HOST / VITE_PUSHER_HOST to that service's public Railway domain.
