# nixpacks.toml
# This file configures the Railway builder (Nixpacks) for the Laravel backend.

[providers]
# Enable both PHP and Node.js providers so Nixpacks installs composer, PHP extensions, Node.js, and npm.
php = {}
node = {}

[phases.setup]
# Force nixpacks to use PHP 8.2 or 8.3
nixPkgs = ["php82", "php82Packages.composer", "nodejs"]

[phases.build]
# Build steps for production
dependsOn = ["setup"]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
    "npm ci && npm run build"
]

[start]
# Option A: Production-ready Nginx + PHP-FPM (Nixpacks default)
# To use the default production-ready Nginx server, leave this commented out and Nixpacks will configure it.
# cmd = "fpm -F && nginx -g 'daemon off;'"

# Option B: php artisan serve (using the dynamic $PORT provided by Railway)
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
